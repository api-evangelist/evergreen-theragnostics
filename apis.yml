aid: evergreen-theragnostics
name: Evergreen Theragnostics
description: 'Evergreen Theragnostics is a Springfield, New Jersey radiopharmaceutical company
  founded in 2019 that operates a cGMP contract development and manufacturing organization
  (CDMO) for therapeutic and diagnostic radiopharmaceuticals, alongside its own clinical
  pipeline of theragnostic pairs including the OCTEVY PET diagnostic imaging agent for
  neuroendocrine tumors. Its 14,000 square foot Springfield facility carries seven commercial-scale
  production suites, sterility lines, quality control and packaging space serving radioligand
  therapy developers. Lantheus Holdings completed its acquisition of the company on April 1,
  2025, and Evergreen now operates as part of Lantheus. The company sells manufacturing
  services and drug products, not software: it publishes no developer program, no public API,
  and no machine-readable specifications.'
